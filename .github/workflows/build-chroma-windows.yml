name: Build Chroma Windows

on:
  push:
    branches: [main]
    paths: ['compressor/**', 'tools/windows/**', '.github/workflows/build-chroma-windows.yml']
  pull_request:
    paths: ['compressor/**', 'tools/windows/**', '.github/workflows/build-chroma-windows.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: compressor
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: compressor/build/_deps
          key: juce-8.0.4-chroma-${{ runner.os }}

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3, AAX and Standalone
        run: |
          cmake --build build --config Release --target Chroma_VST3 --parallel
          cmake --build build --config Release --target Chroma_AAX --parallel
          cmake --build build --config Release --target Chroma_Standalone --parallel

      - name: Render test
        shell: bash
        run: |
          cmake -S test -B test/build -G "Visual Studio 17 2022" -A x64 -DJUCE_DIR="$(pwd)/build/_deps/juce-src"
          cmake --build test/build --config Release --parallel
          ./test/build/ChromaRenderTest_artefacts/Release/ChromaRenderTest.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse build/Chroma_artefacts/Release/VST3/Chroma.vst3 out/
          Copy-Item -Recurse build/Chroma_artefacts/Release/AAX/Chroma.aaxplugin out/
          Copy-Item build/Chroma_artefacts/Release/Standalone/Chroma.exe out/
          @"
          Chroma for Windows (test build)

          Easiest: run Chroma-*-Windows-Setup.exe (installs VST3 and AAX).
          Windows may show "Windows protected your PC": click More info > Run anyway.

          Manual install:
          1. Copy the Chroma.vst3 folder to C:\Program Files\Common Files\VST3
          2. Copy the Chroma.aaxplugin folder to C:\Program Files\Common Files\Avid\Audio\Plug-Ins
          3. Cubase: if Chroma doesn't show up, go to Studio > VST Plug-in Manager and click Rescan.
          4. Pro Tools: this AAX is not PACE-signed yet, so it loads only in Pro Tools Developer.
          5. Chroma.exe is the standalone app, for a quick test without a DAW.
          "@ | Out-File -Encoding utf8 out/README.txt

      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(Chroma VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DPluginName=Chroma /DPluginVersion=$ver "/DSourceDir=$(Resolve-Path out)" "/DOutputDir=$(Resolve-Path out)" "../tools/windows/installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Chroma-Windows
          path: compressor/out/
          retention-days: 7
