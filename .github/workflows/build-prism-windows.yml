name: Build Prism Windows

on:
  push:
    branches: [main]
    paths: ['eq/**', 'tools/windows/**', '.github/workflows/build-prism-windows.yml']
  pull_request:
    paths: ['eq/**', 'tools/windows/**', '.github/workflows/build-prism-windows.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        working-directory: eq
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: eq/build/_deps
          key: juce-8.0.4-prism-${{ runner.os }}

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3, AAX and Standalone
        run: |
          cmake --build build --config Release --target Prism_VST3 --parallel
          cmake --build build --config Release --target Prism_AAX --parallel
          cmake --build build --config Release --target Prism_Standalone --parallel

      - name: Render test
        shell: bash
        run: |
          cmake -S test -B test/build -G "Visual Studio 17 2022" -A x64 -DJUCE_DIR="$(pwd)/build/_deps/juce-src"
          cmake --build test/build --config Release --parallel
          ./test/build/PrismRenderTest_artefacts/Release/PrismRenderTest.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse build/Prism_artefacts/Release/VST3/Prism.vst3 out/
          Copy-Item -Recurse build/Prism_artefacts/Release/AAX/Prism.aaxplugin out/
          Copy-Item build/Prism_artefacts/Release/Standalone/Prism.exe out/
          @"
          Prism for Windows (test build)

          Easiest: run Prism-*-Windows-Setup.exe (installs VST3 and AAX).
          Windows may show "Windows protected your PC": click More info > Run anyway.

          Manual install:
          1. Copy the Prism.vst3 folder to C:\Program Files\Common Files\VST3
          2. Copy the Prism.aaxplugin folder to C:\Program Files\Common Files\Avid\Audio\Plug-Ins
          3. Cubase: if Prism doesn't show up, go to Studio > VST Plug-in Manager and click Rescan.
          4. Pro Tools: this AAX is not PACE-signed yet, so it loads only in Pro Tools Developer.
          5. Prism.exe is the standalone app, for a quick test without a DAW.
          "@ | Out-File -Encoding utf8 out/README.txt

      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(Prism VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DPluginName=Prism /DPluginVersion=$ver "/DSourceDir=$(Resolve-Path out)" "/DOutputDir=$(Resolve-Path out)" "../tools/windows/installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: Prism-Windows
          path: eq/out/
          retention-days: 7

      # A manual run publishes the installer (VST3 only, unsigned) and the raw, not yet PACE-wrapped AAX
      # as a pre-release, so they can be downloaded without an Actions login.
      - name: Publish pre-release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ steps.installer.outputs.version }}"
          $tag = "prism-$ver-windows"
          Compress-Archive -Force -Path out/Prism.aaxplugin -DestinationPath out/Prism-$ver-AAX-unwrapped.zip
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --prerelease --target $env:GITHUB_SHA --title "Prism $ver for Windows" --notes "Unsigned Windows build. Setup.exe installs the VST3. The AAX zip is not PACE-wrapped yet." }
          gh release upload $tag out/Prism-$ver-Windows-Setup.exe out/Prism-$ver-AAX-unwrapped.zip --clobber
