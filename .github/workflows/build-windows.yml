name: Build Windows

on:
  push:
    branches: [main]
    paths-ignore: ['compressor/**']
  pull_request:
    paths-ignore: ['compressor/**']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3, AAX and Standalone
        run: |
          cmake --build build --config Release --target Lumen_VST3 --parallel
          cmake --build build --config Release --target Lumen_AAX --parallel
          cmake --build build --config Release --target Lumen_Standalone --parallel

      - name: Render test
        shell: bash
        run: |
          cmake -S test -B test/build -G "Visual Studio 17 2022" -A x64 -DJUCE_DIR="$(pwd)/build/_deps/juce-src"
          cmake --build test/build --config Release --parallel
          ./test/build/RenderTest_artefacts/Release/RenderTest.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse build/Lumen_artefacts/Release/VST3/Lumen.vst3 out/
          Copy-Item -Recurse build/Lumen_artefacts/Release/AAX/Lumen.aaxplugin out/
          Copy-Item build/Lumen_artefacts/Release/Standalone/Lumen.exe out/
          @"
          Lumen for Windows (test build)

          Easiest: run Lumen-*-Windows-Setup.exe (installs VST3 and AAX).
          Windows may show "Windows protected your PC": click More info > Run anyway.

          Manual install:
          1. Copy the Lumen.vst3 folder to C:\Program Files\Common Files\VST3
          2. Copy the Lumen.aaxplugin folder to C:\Program Files\Common Files\Avid\Audio\Plug-Ins
          3. Cubase: if Lumen doesn't show up, go to Studio > VST Plug-in Manager and click Rescan.
          4. Pro Tools: this AAX is not PACE-signed yet, so it loads only in Pro Tools Developer.
          5. Lumen.exe is the standalone app, for a quick test without a DAW.
          "@ | Out-File -Encoding utf8 out/README.txt

      - name: Build installer
        id: installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(Lumen VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DPluginName=Lumen /DPluginVersion=$ver "/DSourceDir=$(Resolve-Path out)" "/DOutputDir=$(Resolve-Path out)" "tools/windows/installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-Windows
          path: out/

      # A manual run publishes the installer (VST3 only, unsigned) and the raw, not yet PACE-wrapped AAX
      # as a pre-release, so they can be downloaded without an Actions login.
      - name: Publish pre-release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ steps.installer.outputs.version }}"
          $tag = "lumen-$ver-windows"
          Compress-Archive -Force -Path out/Lumen.aaxplugin -DestinationPath out/Lumen-$ver-AAX-unwrapped.zip
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --prerelease --target $env:GITHUB_SHA --title "Lumen $ver for Windows" --notes "Unsigned Windows build. Setup.exe installs the VST3. The AAX zip is not PACE-wrapped yet." }
          gh release upload $tag out/Lumen-$ver-Windows-Setup.exe out/Lumen-$ver-AAX-unwrapped.zip --clobber
