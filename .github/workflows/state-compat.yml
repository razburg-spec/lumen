name: Saved-state compatibility

# Every golden state from a released version must still load correctly (shared/rba/StateIO.h).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  state-compat:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plugin: Lumen,  dir: ".",          option: LUMEN_STATE_TEST }
          - { plugin: Chroma, dir: "compressor", option: CHROMA_STATE_TEST }
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev libgl-dev xvfb
      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: ${{ matrix.dir }}/build-state/_deps
          key: juce-8.0.4-${{ runner.os }}-state-${{ matrix.plugin }}
      - name: Build
        run: |
          cmake -S ${{ matrix.dir }} -B ${{ matrix.dir }}/build-state -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES= -D${{ matrix.option }}=ON
          cmake --build ${{ matrix.dir }}/build-state --target ${{ matrix.plugin }}StateTest
      - name: Load every golden state
        run: xvfb-run -a "$(find ${{ matrix.dir }}/build-state -name ${{ matrix.plugin }}StateTest -type f -perm -u+x | head -1)"
